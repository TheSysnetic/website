# Netlify config — the site is a fully static Next.js export written to ./out

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# --- 301s from the previous site so existing links and rankings carry over ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/company.html"
  to = "/company/"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/services/"
  status = 301
[[redirects]]
  from = "/projects.html"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/web-details.html"
  to = "/services/web-development/"
  status = 301
[[redirects]]
  from = "/mobile-details.html"
  to = "/services/mobile-development/"
  status = 301
[[redirects]]
  from = "/aws-details.html"
  to = "/services/cloud-solutions/"
  status = 301
[[redirects]]
  from = "/ui-ux.html"
  to = "/services/ui-ux-design/"
  status = 301
[[redirects]]
  from = "/low-code.html"
  to = "/services/low-code/"
  status = 301
[[redirects]]
  from = "/marketing.html"
  to = "/services/digital-marketing/"
  status = 301
[[redirects]]
  from = "/rpa-details.html"
  to = "/work/reparametrize-ateliers/"
  status = 301
[[redirects]]
  from = "/burakTech.html"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/productHouse.html"
  to = "/work/product-house/"
  status = 301
[[redirects]]
  from = "/byteForge.html"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy/"
  status = 301
[[redirects]]
  from = "/terms-conditions.html"
  to = "/terms/"
  status = 301
[[redirects]]
  from = "/page-404.html"
  to = "/"
  status = 301

# case studies removed from the site (client sites offline)
[[redirects]]
  from = "/work/burak-technologies/*"
  to = "/work/"
  status = 301
  force = true
[[redirects]]
  from = "/work/byte-forge-technologies/*"
  to = "/work/"
  status = 301
  force = true

# --- headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# hashed build assets never change
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
